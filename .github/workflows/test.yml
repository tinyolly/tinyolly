name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ui:
    name: Test TinyOlly UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            docker/apps/tinyolly-ui/requirements.txt
            docker/apps/tinyolly-ui/requirements-test.txt

      - name: Install dependencies
        run: |
          cd docker/apps/tinyolly-ui
          pip install -r requirements.txt -r requirements-test.txt ../tinyolly-common

      - name: Run tests
        run: |
          cd docker/apps/tinyolly-ui
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: docker/apps/tinyolly-ui/coverage.xml
          fail_ci_if_error: false

  check-otlp-receiver:
    name: Check OTLP Receiver (no unit tests yet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: docker/apps/tinyolly-otlp-receiver/requirements.txt

      - name: Install locked dependencies and byte-compile
        run: |
          cd docker/apps/tinyolly-otlp-receiver
          pip install -r requirements.txt ../tinyolly-common
          python -m compileall -q .

  test-go:
    name: Go (opamp server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: docker/apps/tinyolly-opamp-server/go.mod
          cache-dependency-path: docker/apps/tinyolly-opamp-server/go.sum

      - name: Verify go.mod/go.sum are tidy
        run: |
          cd docker/apps/tinyolly-opamp-server
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet, test and build
        run: |
          cd docker/apps/tinyolly-opamp-server
          go vet ./...
          go test ./...
          go build -o /dev/null .

  validate-collector-configs:
    name: Validate collector configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: otelcol-contrib validate
        run: |
          VER=$(grep '^OTELCOL_VERSION=' versions.env | cut -d= -f2 | awk '{print $1}')
          for f in docker/otelcol-configs/config.yaml docker/otelcol-configs/templates/*.yaml; do
            case "$f" in *incorrect.yaml) continue ;; esac   # deliberately invalid example
            echo "validating $f"
            docker run --rm -v "$PWD/$f":/c.yaml \
              ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:$VER \
              validate --config /c.yaml
          done

  test-common:
    name: Test TinyOlly Common
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            docker/apps/tinyolly-common/setup.py
            docker/apps/tinyolly-common/requirements-test.txt

      - name: Install dependencies
        run: |
          cd docker/apps/tinyolly-common
          pip install -r requirements-test.txt .

      - name: Run tests
        run: |
          cd docker/apps/tinyolly-common
          pytest tests/ -v --cov=tinyolly_common --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: docker/apps/tinyolly-common/coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install linters
        run: pip install ruff

      - name: Run ruff
        run: ruff check docker/apps/
