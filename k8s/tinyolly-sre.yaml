# TinyOlly AI SRE Agent (opt-in): kubectl apply -f k8s/tinyolly-sre.yaml   (build/load first: k8s/06-rebuild+deploy-sre.sh)
# Model: local Ollama by default (built and tested with qwen3.8 27B on a GPU box on the LAN; change LLM_URL/MODEL to yours).
# Cloud presets (console model picker): kubectl create secret generic tinyolly-sre-llm --from-literal=ANTHROPIC_API_KEY=... [--from-literal=OPENAI_API_KEY=...]
# Demo shift driver: k8s/06-rebuild+deploy-sre.sh --demo (flips OTel demo flags through flagd-ui at flagd:4000).
apiVersion: apps/v1
kind: Deployment
metadata: {name: tinyolly-sre, labels: {app: tinyolly-sre}}
spec:
  replicas: 1
  selector: {matchLabels: {app: tinyolly-sre}}
  template:
    metadata: {labels: {app: tinyolly-sre}}
    spec:
      containers:
      - name: tinyolly-sre
        image: tinyolly/sre:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        env:
        - {name: TINYOLLY_URL, value: "http://tinyolly-ui:5002"}
        - {name: TINYOLLY_MCP_URL, value: "http://tinyolly-mcp:8765/mcp"}
        - {name: LLM_URL, value: "http://192.168.68.71:11434/v1"}
        - {name: MODEL, value: "qwen3.8:27b-mtp-q4_K_M"}
        - {name: LLM_PRESET, value: "local"}
        - {name: TINYOLLY_PUBLIC_URL, value: "http://localhost:5005"}
        envFrom:
        - secretRef: {name: tinyolly-sre-llm, optional: true}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
        resources:
          requests: {memory: "64Mi", cpu: "50m"}
          limits: {memory: "256Mi", cpu: "300m"}
---
apiVersion: v1
kind: Service
metadata: {name: tinyolly-sre}
spec:
  selector: {app: tinyolly-sre}
  ports: [{port: 8080, targetPort: 8080}]
