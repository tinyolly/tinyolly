# TinyOlly MCP server (read-only) as a pod next to the UI. Clients connect to http://localhost:8765/mcp
# (kind port mapping 8765 -> NodePort 30876, see scripts/kind-config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyolly-mcp
  labels:
    app: tinyolly-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyolly-mcp
  template:
    metadata:
      labels:
        app: tinyolly-mcp
    spec:
      containers:
      - name: tinyolly-mcp
        image: tinyolly/mcp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8765
        env:
        - name: TINYOLLY_URL
          value: "http://tinyolly-ui:5002"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8765
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tinyolly-mcp
spec:
  type: NodePort
  selector:
    app: tinyolly-mcp
  ports:
    - protocol: TCP
      port: 8765
      targetPort: 8765
      nodePort: 30876
