# Sampling: tail_sampling keeps errors + slow traces + 10% of the rest; probabilistic_sampler thins logs
# DEMO: trace count drops while every error/slow trace is retained. RED metrics (spanmetrics) are computed
# BEFORE sampling via the forward connector, so rates stay accurate. See docs/collector-presets.md.
# Components: memory_limiter, resourcedetection, tail_sampling, probabilistic_sampler, forward, spanmetrics
# NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
# defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  opamp:
    server:
      ws:
        endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

processors:
  # --- baseline (always on) ---
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false
  batch:
    timeout: 1s
    send_batch_size: 1024
  # --- preset: sampling ---
  tail_sampling:
    decision_wait: 5s
    num_traces: 10000
    policies:
      - name: keep-errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: keep-slow
        type: latency
        latency: { threshold_ms: 500 }
      - name: sample-10-percent
        type: probabilistic
        probabilistic: { sampling_percentage: 10 }
  probabilistic_sampler/logs:
    sampling_percentage: 25

connectors:
  forward/traces: {}
  spanmetrics:
    histogram:
      explicit:
        buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: http.request.method
      - name: http.response.status_code
    dimensions_cache_size: 1000
    aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
    metrics_flush_interval: 15s
    metrics_expiration: 5m

exporters:
  debug:
    verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
  otlp:
    endpoint: "tinyolly-otlp-receiver:4343"
    tls:
      insecure: true

service:
  extensions: [opamp]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection]
      exporters: [spanmetrics, forward/traces]
    traces/sampled:
      receivers: [forward/traces]
      processors: [tail_sampling, batch]
      exporters: [debug, otlp]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug, otlp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, probabilistic_sampler/logs, batch]
      exporters: [debug, otlp]
