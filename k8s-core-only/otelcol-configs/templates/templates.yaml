apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-templates
data:
  connectors-metrics.yaml: |
    # Connectors (metrics): spanmetrics with exemplars, servicegraph, count and signaltometrics derive metrics from traces/logs
    # DEMO: RED metrics with exemplars linking to traces, a collector-built service graph, span/log counts, custom span-duration metric.
    # Components: spanmetrics (exemplars on), servicegraph, count, signaltometrics
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024


    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        exemplars:
          enabled: true
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m
      servicegraph:
        latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 5s]
        dimensions: [http.method, http.request.method]
        store:
          ttl: 5s
          max_items: 1000
        metrics_flush_interval: 15s
      count:
        spans:
          tinyolly.span.count:
            description: Spans seen by the collector, by service
            attributes:
              - key: service.name
          tinyolly.span.error.count:
            description: Spans with error status seen by the collector, by service
            conditions:
              - status.code == STATUS_CODE_ERROR
            attributes:
              - key: service.name
        logs:
          tinyolly.log.count:
            description: Log records seen by the collector
      signaltometrics:
        spans:
          - name: tinyolly.span.duration
            description: Span duration as an exponential histogram, per service
            unit: ms
            include_resource_attributes:
              - key: service.name
            exponential_histogram:
              value: Milliseconds(end_time - start_time)

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp, spanmetrics, servicegraph, count, signaltometrics]
        metrics:
          receivers: [otlp, spanmetrics, servicegraph, count, signaltometrics]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp, count]
  connectors-routing.yaml: |
    # Connectors (routing): routing sends error spans down their own pipeline; failover falls back to a local file if TinyOlly is unreachable
    # DEMO: spans with error status get collector.route=errors in a dedicated 'traces/errors' pipeline (both pipelines still
    # export to TinyOlly, so traces stay complete there). If the primary exporter fails, failover switches to a file exporter
    # (/var/lib/otelcol/failover-traces.jsonl), so nothing is lost during an outage. Components: routing, failover, attributes, file
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: routing ---
      attributes/errors:
        actions:
          - key: collector.route
            value: errors
            action: insert

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m
      routing:
        default_pipelines: [traces/normal]
        error_mode: ignore
        table:
          - context: span
            condition: status.code == STATUS_CODE_ERROR
            pipelines: [traces/errors]
      failover:
        priority_levels:
          - [traces/primary]
          - [traces/backup]
        retry_interval: 30s

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true
      # Failover only switches when the primary exporter returns an error to the pipeline. The default exporter queue
      # and retries accept data and retry in the background, so the failover exporter must not queue or retry.
      otlp/primary:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true
        timeout: 2s
        sending_queue:
          enabled: false
        retry_on_failure:
          enabled: false
      # Backup: keep the spans on disk instead of discarding them while the primary is down.
      file/backup:
        path: /var/lib/otelcol/failover-traces.jsonl
        format: json
        rotation:
          max_megabytes: 20
          max_backups: 2

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection]
          exporters: [routing, spanmetrics]
        traces/normal:
          receivers: [routing]
          processors: [batch]
          exporters: [failover]
        traces/errors:
          receivers: [routing]
          processors: [attributes/errors, batch]
          exporters: [failover]
        traces/primary:
          receivers: [failover]
          exporters: [otlp/primary]
        traces/backup:
          receivers: [failover]
          exporters: [file/backup]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
  enrichment.yaml: |
    # Enrichment: resource/attributes add deployment context; groupbyattrs compacts telemetry per service
    # DEMO: every span/log/metric carries service.namespace + deployment.environment.name + collector host info.
    # Kubernetes pod/namespace enrichment (k8sattributes) and geoip are not in this preset: they need RBAC / a MaxMind DB.
    # Components: memory_limiter, resourcedetection, resource, groupbyattrs
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: enrichment ---
      resource/enrich:
        attributes:
          - key: service.namespace
            value: tinyolly-demo
            action: insert
          - key: deployment.environment.name
            value: demo
            action: insert
          - key: collector.preset
            value: enrichment
            action: upsert
      groupbyattrs/service:
        keys: [service.name]

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource/enrich, groupbyattrs/service, batch]
          exporters: [debug, otlp, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, resource/enrich, groupbyattrs/service, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource/enrich, groupbyattrs/service, batch]
          exporters: [debug, otlp]
  logs-dedup.yaml: |
    # Logs: logdedup collapses repeated identical logs into one record with a count; transform normalizes severity
    # DEMO: a log spam burst becomes one record with dedup_count; WARN/Warning/CRITICAL etc. map to canonical severities.
    # Only INFO/DEBUG logs WITHOUT a trace id are deduplicated: ERROR/FATAL logs and logs correlated to a trace pass through
    # untouched, because folding them would lose per-occurrence data and break log-to-trace links.
    # Components: memory_limiter, resourcedetection, transform, logdedup (filelog receiver can be added for file sources)
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: logs ---
      transform/severity:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(severity_text, "(?i)^warn")
              - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(severity_text, "(?i)^(crit|fatal)")
              - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsMatch(severity_text, "(?i)^err")
      logdedup:
        interval: 10s
        log_count_attribute: dedup_count
        timezone: UTC
        # Records that match NONE of these conditions are passed through unchanged.
        conditions:
          - 'severity_number < SEVERITY_NUMBER_ERROR and trace_id == TraceID(0x00000000000000000000000000000000)'

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, transform/severity, logdedup, batch]
          exporters: [debug, otlp]
  metrics-shaping.yaml: |
    # Metrics shaping: temporality conversion, rate limiting, filtering and label dropping to cut cardinality
    # DEMO: delta inputs become cumulative, noisy runtime metrics are dropped, flush interval is 30s, labels are aggregated.
    # Components: memory_limiter, resourcedetection, deltatocumulative, filter, metricstransform, interval, spanmetrics
    # (cumulativetodelta is available too: add it after 'interval' for backends that want delta.)
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: metrics shaping ---
      deltatocumulative:
        max_stale: 5m
      filter/metrics:
        error_mode: ignore
        metrics:
          metric:
            - 'IsMatch(name, "^process\\.runtime\\..*")'
            - 'IsMatch(name, "^runtime\\..*")'
      metricstransform/cardinality:
        transforms:
          - include: ^http\.(server|client)\..*duration$
            match_type: regexp
            action: update
            operations:
              - action: aggregate_labels
                label_set: [http.request.method, http.response.status_code, http.method, http.status_code, service.name]
                aggregation_type: sum
      interval:
        interval: 30s

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, deltatocumulative, filter/metrics, metricstransform/cardinality, interval, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
  pii-redaction.yaml: |
    # PII / security: redaction masks emails, card numbers and tokens; attributes hashes/deletes sensitive keys
    # DEMO: send spans/logs with user.email, http.url?token=..., card numbers -> they appear masked in TinyOlly.
    # Covers traces, logs and metrics (attribute values). Card patterns match real card formats only (grouped digits, or
    # contiguous Visa/MC/Amex/Discover), so epoch timestamps and numeric IDs are not masked.
    # Components: memory_limiter, resourcedetection, redaction, attributes (hash/delete)
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: pii / security ---
      attributes/pii:
        actions:
          - key: user.id
            action: hash
          - key: http.request.header.authorization
            action: delete
          - key: http.request.header.cookie
            action: delete
      redaction:
        allow_all_keys: true
        blocked_key_patterns: [".*password.*", ".*secret.*", ".*api[_-]?key.*", ".*cvv.*", ".*cvc.*", ".*card[_.]?number.*"]
        blocked_values:
          - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"      # email addresses
          - "\\b(?:\\d{4}[ -]){3}\\d{3,4}\\b"                          # card numbers written in groups: 4111 1111 1111 1111
          - "\\b(?:4\\d{12}(?:\\d{3}){0,2}|5[1-5]\\d{14}|3[47]\\d{13}|6(?:011|5\\d{2})\\d{12}|2(?:22[1-9]|2[3-9]\\d|[3-6]\\d{2}|7[01]\\d|720)\\d{12})\\b"  # contiguous Visa/MC (51-55, 2221-2720)/Amex/Discover (not epoch-ns or random IDs)
          - "(?i)\\bbearer\\s+[a-z0-9._~+/=-]{16,}"                   # bearer tokens (16+ chars, so prose like "bearer of news" is left alone)
          - "(?i)\\b(token|access_token|id_token|refresh_token|api[_-]?key|apikey|key|password|passwd|pwd|secret|client_secret|sig|signature|x-amz-signature|auth)=[^&\\s]+"  # secrets in URL query strings
          - "\\b3[47]\\d{2}[ -]\\d{6}[ -]\\d{5}\\b"                      # American Express written 4-6-5
        summary: info   # adds redaction.masked.count etc. so the UI can show what was masked

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes/pii, redaction, batch]
          exporters: [debug, otlp, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, redaction, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, attributes/pii, redaction, batch]
          exporters: [debug, otlp]
  prometheus-remote-write.yaml: |
    # Configuration with Prometheus Remote Write receiver
    # Extends the default config to accept Prometheus remote write metrics
    # in addition to OTLP. Useful for integrating Prometheus exporters and
    # Prometheus-compatible clients that use the Remote Write protocol.
    #
    # The prometheusremotewrite receiver accepts metrics via Prometheus Remote Write v2 protocol.
    # Clients should configure their remote_write endpoint to:
    #   http://<collector-host>:19291/api/v1/write
    #
    # Reference: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/prometheusremotewritereceiver

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Prometheus Remote Write receiver
      # Receives metrics via Prometheus Remote Write protocol
      # Clients should send to: http://<collector-host>:19291/api/v1/write
      # Reference: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/prometheusremotewritereceiver
      prometheusremotewrite:
        endpoint: "0.0.0.0:19291"
        # Optional: configure authentication
        # auth:
        #   authenticator: basicauth
        # Optional: configure TLS
        # tls:
        #   cert_file: /path/to/cert.pem
        #   key_file: /path/to/key.pem

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # baseline: memory protection matters most here, this preset opens a receiver on :19291
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          # current semconv names (old ones kept for older instrumentation)
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic

      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp, spanmetrics]

        metrics:
          # Include both OTLP metrics and Prometheus remote write metrics
          receivers: [otlp, prometheusremotewrite, spanmetrics]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]

        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
  sampling.yaml: |
    # Sampling: tail_sampling keeps errors + slow traces + 10% of the rest; probabilistic_sampler thins INFO/DEBUG logs (WARN and above are always kept)
    # DEMO: trace count drops while every error/slow trace is retained. RED metrics (spanmetrics) are computed
    # BEFORE sampling via the forward connector, so rates stay accurate. See docs/collector-presets.md.
    # Components: memory_limiter, resourcedetection, tail_sampling, probabilistic_sampler, forward, spanmetrics
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: sampling ---
      tail_sampling:
        decision_wait: 5s
        num_traces: 10000
        policies:
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: keep-slow
            type: latency
            latency: { threshold_ms: 500 }
          - name: sample-10-percent
            type: probabilistic
            probabilistic: { sampling_percentage: 10 }
      # Logs: keep every WARN/ERROR/FATAL record; sample the rest at 25 %. The sampler honours a per-record priority
      # attribute (100 = always keep). NOTE: log sampling is independent of the tail_sampling trace decision, so a kept
      # trace can have its INFO logs sampled away (errors and warnings always survive).
      # The sampler needs something to hash. By default it hashes the trace id and DROPS records that have none (most
      # application logs!), so give every record a key: the trace id when present (all logs of a trace are kept or
      # dropped together), otherwise a random UUID (a plain 25 % sample).
      transform/log_priority:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["sampling.priority"], 100) where severity_number >= SEVERITY_NUMBER_WARN
              - set(attributes["sampling.key"], UUID())
              - set(attributes["sampling.key"], trace_id.string) where trace_id != TraceID(0x00000000000000000000000000000000)
      probabilistic_sampler/logs:
        sampling_percentage: 25
        sampling_priority: sampling.priority
        attribute_source: record
        from_attribute: sampling.key
      # the priority attribute is only a hint for the sampler above: do not leak it into stored logs
      transform/log_cleanup:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "sampling.priority")
              - delete_key(attributes, "sampling.key")

    connectors:
      forward/traces: {}
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection]
          exporters: [spanmetrics, forward/traces]
        traces/sampled:
          receivers: [forward/traces]
          processors: [tail_sampling, batch]
          exporters: [debug, otlp]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, transform/log_priority, probabilistic_sampler/logs, transform/log_cleanup, batch]
          exporters: [debug, otlp]
  transform-ottl.yaml: |
    # Transform / OTTL: normalize routes, derive log severity, flatten JSON bodies, drop health checks and debug logs
    # DEMO: cleaner route names, correct severity, no health-check noise (see dropped counts on the Collector tab).
    # Components: memory_limiter, resourcedetection, transform, filter, resource
    # NOTE: the supervisor MERGES remote config into the base config.yaml (pipelines are merged by name), so every preset
    # defines its main pipelines as 'traces', 'metrics' and 'logs' to override the base ones; extra pipelines use suffixes.

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      opamp:
        server:
          ws:
            endpoint: ws://tinyolly-opamp-server:4320/v1/opamp

    processors:
      # --- baseline (always on) ---
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resourcedetection:
        detectors: [env, system]
        timeout: 2s
        override: false
      batch:
        timeout: 1s
        send_batch_size: 1024
      # --- preset: transform / OTTL ---
      resource/env:
        attributes:
          - key: deployment.environment.name
            value: demo
            action: insert
      transform/traces:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - replace_pattern(attributes["http.route"], "/[0-9]+", "/{id}")
              - replace_pattern(name, "/[0-9]+", "/{id}")
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # 1. JSON bodies become attributes
              - merge_maps(attributes, ParseJSON(body), "upsert") where IsString(body) and IsMatch(body, "^\\s*\\{")
              # 2. a JSON "level" field sets the severity when the record has none (so the debug filter below can see it)
              - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(attributes["level"]) and IsMatch(attributes["level"], "(?i)^(debug|trace)$")
              - set(severity_number, SEVERITY_NUMBER_INFO) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(attributes["level"]) and IsMatch(attributes["level"], "(?i)^info$")
              - set(severity_number, SEVERITY_NUMBER_WARN) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(attributes["level"]) and IsMatch(attributes["level"], "(?i)^warn(ing)?$")
              - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(attributes["level"]) and IsMatch(attributes["level"], "(?i)^error$")
              - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(attributes["level"]) and IsMatch(attributes["level"], "(?i)^(fatal|critical)$")
              # 3. otherwise an UPPERCASE level token in a plain-text body means ERROR ("no exception" / "error rate=0" do not match)
              - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_number == SEVERITY_NUMBER_UNSPECIFIED and IsString(body) and IsMatch(body, "\\b(ERROR|FATAL|CRITICAL|Traceback)\\b")
              - set(severity_text, "ERROR") where severity_number == SEVERITY_NUMBER_ERROR and severity_text == ""
      filter/noise:
        error_mode: ignore
        traces:
          span:
            # probe paths only: "/healthz", "/health/db", "/ready?x=1" match; "/healthcare" and "/ready-made" do not
            - 'IsString(attributes["url.path"]) and IsMatch(attributes["url.path"], "^/(health|healthz|healthcheck|ready|readyz|live|livez|liveness|readiness)(/|\\?|$)")'
            - 'IsString(attributes["http.target"]) and IsMatch(attributes["http.target"], "^/(health|healthz|healthcheck|ready|readyz|live|livez|liveness|readiness)(/|\\?|$)")'
            - 'IsString(attributes["http.route"]) and IsMatch(attributes["http.route"], "^/(health|healthz|healthcheck|ready|readyz|live|livez|liveness|readiness)(/|$)")'
        logs:
          log_record:
            - 'severity_number != SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_INFO'

    connectors:
      spanmetrics:
        histogram:
          explicit:
            buckets: [1ms, 4ms, 10ms, 20ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]
        dimensions:
          - name: http.method
          - name: http.status_code
          - name: http.request.method
          - name: http.response.status_code
        dimensions_cache_size: 1000
        aggregation_temporality: "AGGREGATION_TEMPORALITY_CUMULATIVE"
        metrics_flush_interval: 15s
        metrics_expiration: 5m

    exporters:
      debug:
        verbosity: basic   # was 'detailed'; switch back to debug a single pipeline
      otlp:
        endpoint: "tinyolly-otlp-receiver:4343"
        tls:
          insecure: true

    service:
      extensions: [opamp]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource/env, filter/noise, transform/traces, batch]
          exporters: [debug, otlp, spanmetrics]
        metrics:
          receivers: [otlp, spanmetrics]
          processors: [memory_limiter, resourcedetection, resource/env, batch]
          exporters: [debug, otlp]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource/env, transform/logs, filter/noise, batch]
          exporters: [debug, otlp]
