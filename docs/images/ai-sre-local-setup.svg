<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Inter,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>TinyOlly AI SRE Agent: local setup</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0066CC"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1000" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Mac / Colima -->
  <rect x="24" y="24" width="640" height="492" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="44" y="52" font-size="14" font-weight="700" fill="#0f172a">Your Mac</text>
  <text x="44" y="70" font-size="12" fill="#64748b">Colima VM, Docker</text>

  <!-- OTel demo -->
  <rect x="44" y="92" width="190" height="250" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="139" y="118" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">OpenTelemetry Demo</text>
  <text x="139" y="136" font-size="11" fill="#64748b" text-anchor="middle">Astronomy Shop, 16 services</text>
  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <rect x="58" y="150" width="76" height="26" rx="6" fill="#dbeafe"/><text x="96" y="167">frontend</text>
    <rect x="144" y="150" width="76" height="26" rx="6" fill="#dbeafe"/><text x="182" y="167">checkout</text>
    <rect x="58" y="184" width="76" height="26" rx="6" fill="#dbeafe"/><text x="96" y="201">payment</text>
    <rect x="144" y="184" width="76" height="26" rx="6" fill="#dbeafe"/><text x="182" y="201">cart</text>
    <rect x="58" y="218" width="76" height="26" rx="6" fill="#dbeafe"/><text x="96" y="235">shipping</text>
    <rect x="144" y="218" width="76" height="26" rx="6" fill="#dbeafe"/><text x="182" y="235">ad, catalog…</text>
    <rect x="58" y="258" width="162" height="26" rx="6" fill="#e2e8f0"/><text x="139" y="275">load generator</text>
    <rect x="58" y="298" width="162" height="30" rx="6" fill="#fee2e2" stroke="#fca5a5"/><text x="139" y="317" fill="#991b1b" font-weight="600">flagd (fault flags)</text>
  </g>

  <!-- Collector -->
  <rect x="290" y="150" width="110" height="64" rx="10" fill="#ffffff" stroke="#0066CC" stroke-width="1.5"/>
  <text x="345" y="178" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">OTel</text>
  <text x="345" y="196" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Collector</text>

  <!-- TinyOlly -->
  <rect x="452" y="92" width="190" height="196" rx="10" fill="#eff6ff" stroke="#0066CC" stroke-width="1.5"/>
  <text x="547" y="118" font-size="14" font-weight="700" fill="#0000AA" text-anchor="middle">TinyOlly</text>
  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <rect x="466" y="132" width="162" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/><text x="547" y="149">Store: traces, logs, metrics</text>
    <rect x="466" y="166" width="162" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/><text x="547" y="183">Web UI  :5005</text>
    <rect x="466" y="200" width="162" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/><text x="547" y="217">MCP server (read-only tools)</text>
    <rect x="466" y="234" width="162" height="26" rx="6" fill="#ffffff" stroke="#bfdbfe"/><text x="547" y="251">Change markers</text>
  </g>

  <!-- Agent -->
  <rect x="290" y="372" width="352" height="124" rx="10" fill="#0066CC"/>
  <text x="466" y="400" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">TinyOlly AI SRE Agent</text>
  <text x="466" y="420" font-size="12" fill="#dbeafe" text-anchor="middle">detect · investigate · propose a fix · check recovery</text>
  <g font-size="11" text-anchor="middle">
    <rect x="304" y="438" width="100" height="42" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="354" y="456" fill="#ffffff">Console</text><text x="354" y="470" fill="#bfdbfe">:7173</text>
    <rect x="416" y="438" width="100" height="42" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="466" y="456" fill="#ffffff">Demo shift</text><text x="466" y="470" fill="#bfdbfe">fault scheduler</text>
    <rect x="528" y="438" width="100" height="42" rx="6" fill="#ffffff" fill-opacity=".16"/><text x="578" y="456" fill="#ffffff">Ask panel</text><text x="578" y="470" fill="#bfdbfe">/ask</text>
  </g>

  <!-- Ubuntu box -->
  <rect x="724" y="196" width="252" height="190" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="850" y="226" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Ubuntu RTX 5090 Qwen</text>
  <text x="850" y="246" font-size="12" fill="#64748b" text-anchor="middle">home network, one GPU box</text>
  <g font-size="11" text-anchor="middle">
    <rect x="744" y="262" width="212" height="26" rx="6" fill="#dcfce7"/><text x="850" y="279" fill="#166534">Ollama · OpenAI-compatible API</text>
    <rect x="744" y="296" width="212" height="26" rx="6" fill="#dcfce7"/><text x="850" y="313" fill="#166534">Qwen3.8 27B · q4 · MTP</text>
    <rect x="744" y="330" width="212" height="26" rx="6" fill="#f1f5f9"/><text x="850" y="347" fill="#475569">Optional: OpenAI or Claude (picker)</text>
  </g>

  <!-- Presenter -->
  <rect x="724" y="440" width="252" height="56" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="850" y="464" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Browser</text>
  <text x="850" y="482" font-size="11" fill="#64748b" text-anchor="middle">watches the console, asks questions</text>

  <!-- Arrows -->
  <path d="M234 182H288" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="261" y="174" font-size="10" fill="#64748b" text-anchor="middle">OTLP</text>
  <path d="M400 182H450" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M547 290V370" stroke="#0066CC" stroke-width="2" fill="none" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="556" y="334" font-size="10" fill="#0066CC">MCP tools + API</text>
  <path d="M290 440H139V344" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#r)"/>
  <text x="139" y="462" font-size="10" fill="#dc2626" text-anchor="middle">demo flips faults</text><text x="139" y="476" font-size="10" fill="#dc2626" text-anchor="middle">on and off</text>
  <path d="M642 468H722" stroke="#64748b" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M642 396H683V340H722" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="850" y="418" font-size="10" fill="#166534" text-anchor="middle">prompts and answers over the LAN</text>
  <path d="M850 440V388" stroke="#64748b" stroke-width="0" fill="none"/>
</svg>
